name: API CI

on:
  push:
    branches: ["**"]
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy app

      - name: Test
        run: pytest --cov --cov-report=term-missing

  migrations:
    name: Migrations apply and roll back
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # A migration that has never been executed is a migration that does not work. This
    # job applies the full history to an empty TimescaleDB, then rolls it back, so both
    # directions are exercised on every change.
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LEDGERLINE_DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@localhost:5432/ledgerline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify the models match the migrated schema
        # An empty autogenerate diff proves the migration and the models agree. Without
        # this, a model change without a migration passes every other check and fails
        # in production.
        run: |
          alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift
          if grep -qE "op\.(create|drop|alter|add)" migrations/versions/ci_drift_*.py; then
            echo "::error::Models have drifted from the migrations. Run 'make migration'."
            cat migrations/versions/ci_drift_*.py
            exit 1
          fi
          rm migrations/versions/ci_drift_*.py

      - name: Run database-backed tests
        env:
          LEDGERLINE_TEST_DATABASE_URL: postgresql+asyncpg://ledgerline:ledgerline@localhost:5432/ledgerline
        run: pytest -m db

      - name: Roll back
        run: alembic downgrade base
