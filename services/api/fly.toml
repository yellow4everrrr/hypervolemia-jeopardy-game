# Fly.io deployment for the API and the background worker.
#
# Two process groups from one image, because they are the same application: the worker
# runs pattern scans, simulator sweeps, report generation and screenshot capture, and it
# must be built from exactly the code that serves the requests which enqueue those jobs.
# Deploying them separately is how a handler and its caller drift apart.
#
# `app_name` is intentionally absent — `fly launch` writes it, so this file does not
# claim a name somebody else may already own.

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Migrations run once per deploy, before any new machine takes traffic, and a failure
# here aborts the release rather than leaving half the fleet talking to a schema it does
# not understand. `alembic upgrade head` is idempotent, so a retried deploy is safe.
[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m app.jobs.worker"

[env]
  LEDGERLINE_ENVIRONMENT = "production"
  LEDGERLINE_LOG_JSON = "true"
  # Fly's Tigris object storage is S3-compatible, which is why `s3_endpoint_url` exists
  # as a setting at all. Set the bucket with `fly storage create`; it populates
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / BUCKET_NAME as secrets automatically.
  LEDGERLINE_S3_ENDPOINT_URL = "https://fly.storage.tigris.dev"
  LEDGERLINE_S3_REGION = "auto"

# Only the `app` process serves HTTP. The worker has no listener and would fail a health
# check it was never meant to answer.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Never scale the API to zero: a suspended machine still has to cold-start, and the
  # first request after an idle period would eat that latency. One machine is cheap.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    # `/health` is liveness only — it must not touch the database, or a brief database
    # blip restarts every machine and turns a recoverable outage into an outage plus a
    # thundering herd of cold starts.
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

  [[http_service.checks]]
    # Readiness does check dependencies, and is deliberately given a longer grace period
    # so a machine is not pulled from the pool while it is still opening its pool.
    path = "/health/ready"
    interval = "30s"
    timeout = "10s"
    grace_period = "45s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

# The worker is the memory-hungry half: a simulator sweep bootstraps nine scenarios over
# the full trade history in one process, and the pattern scan holds a feature matrix.
# Measured at ~96 seconds and comfortably inside 1 GB on the demo history of 1,398
# trades; a real account with years of data will need more than the API does.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
  processes = ["worker"]
